name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.repository == 'tommy-ca/LazyPi' && github.ref == 'refs/heads/feat/strict-native-pstack-proof') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Validate openspecs
        run: npm run spec:validate

      - name: Smoke-test packed CLI artifact
        run: node scripts/packed-cli-smoke.mjs

      - name: Run lazypi --yes
        run: node bin/lazypi.mjs --yes

      - name: Install optional catalog tier
        run: node bin/lazypi.mjs --yes --only optional

      - name: Assert expected packages for full install
        run: node scripts/assert-installed-packages.mjs --check-status

      - name: Run packed-CLI e2e harness (real pi, sandboxed)
        run: node scripts/e2e-install.mjs

  native-pstack:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'tommy-ca/LazyPi' && github.ref == 'refs/heads/feat/strict-native-pstack-proof' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Native discovery and conditional one-child proof
        run: node scripts/native-pstack-proof.mjs --hosted
